url: https://justinjtownsend.github.io/skiresultsR
template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#0054AD"
    border-radius: 0.5rem
    btn-border-radius: 0.25rem
    danger: "#A6081A"

home:
  # Title and description are automatically pulled from DESCRIPTION file

reference:
- title: "Event Functions"
  desc: "Functions for extracting complete event information"
  contents:
  - get_event
  - get_event_dtls
  - get_event_summary
  
- title: "Race Functions"
  desc: "Functions for extracting race data and results"
  contents:
  - get_races
  - get_race
  - get_race_types
  
- title: "Data Extraction Functions"
  desc: "Functions for extracting specific data types from races"
  contents:
  - get_racers
  - get_points
  - get_clubs

articles:
- title: Articles
  navbar: ~
  contents:
  - getting-started

search:
  exclude: ['articles/index.html']

navbar:
  structure:
    left: [home, reference, articles]
    right: [search, github, lightswitch]
  components:
    home:
      icon: fas fa-home fa-lg
      href: index.html
      aria-label: View Home
    reference:
      text: Reference
      href: reference/index.html
      aria-label: View Reference
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/justinjtownsend/skiresultsR
      aria-label: GitHub
